name: webkit-animation-repro
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: React + motion popup harness
        run: |
          node h7.mjs 100 3 &
          node h7.mjs 100 3 '?work=60' &
          wait
